<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homie Parts Logger</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e0c; --panel:#131916; --panel-2:#1a221e; --line:#26312c;
  --green:#1a6b2f; --lit:#3ddc6b; --cyan:#3dd6dc; --amber:#e8a33d; --red:#e05a4e;
  --text:#e6ece8; --muted:#7d8b84;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:20px 18px 80px}

h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.05em;margin:0;color:var(--lit);font-weight:400}
.mono{font-family:'IBM Plex Mono',monospace}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
header{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
header .lbl{margin-left:auto}

.sec-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec-title:after{content:"";flex:1;height:1px;background:var(--line)}

/* stock grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.chip .n{font-size:13px;color:#c3cec8;line-height:1.25;min-height:32px}
.chip .c{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;margin-top:6px;color:var(--lit)}
.chip .u{font-size:11px;color:var(--muted);margin-left:4px}
.chip.low{border-color:#5a2a26}
.chip.low .c{color:var(--red)}
.chip.zero .c{color:var(--red)}
.chip .tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-top:3px;height:12px}

/* donor bots */
.donor{display:flex;align-items:center;gap:11px;background:rgba(232,163,61,.07);border:1px solid #4a3a20;border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:11px 14px;margin-bottom:8px}
.donor .b{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--amber);flex:none}
.donor .d{font-size:13px;color:#c3cec8;flex:1}
.donor .since{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;font-style:italic;padding:4px 0}

/* form */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.toggle{display:flex;gap:8px;margin-bottom:16px}
.toggle button{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
.toggle button.on{background:#1f2a24;border-color:var(--green);color:var(--lit)}
.toggle button:focus-visible{outline:2px solid var(--lit);outline-offset:2px}

.row2{display:flex;gap:12px;flex-wrap:wrap}
.row2>.f{flex:1;min-width:150px}
.f{margin-bottom:13px}
.f>.lbl{display:block;margin-bottom:5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
select{cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

.kindrow{display:flex;gap:8px;margin-bottom:14px}
.kindrow label{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;font-weight:500}
.kindrow input{width:auto;margin:0}
.kindrow label.on{border-color:var(--green);background:#1f2a24}

.qty{display:flex;align-items:center;gap:0}
.qty button{width:44px;height:42px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-size:20px;cursor:pointer}
.qty button:first-child{border-radius:8px 0 0 8px}
.qty button:last-child{border-radius:0 8px 8px 0}
.qty input{border-radius:0;text-align:center;border-left:none;border-right:none}

.save{width:100%;background:var(--green);border:none;color:#fff;border-radius:10px;padding:15px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.save:hover{background:#22853b}
.save:disabled{opacity:.5;cursor:default}
.save:focus-visible{outline:2px solid var(--lit);outline-offset:2px}

.flash{text-align:center;font-size:14px;padding:10px;border-radius:8px;margin-top:12px;display:none}
.flash.ok{display:block;background:rgba(61,220,107,.12);color:var(--lit)}
.flash.err{display:block;background:rgba(224,90,78,.12);color:var(--red)}

/* history */
.log{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.le{display:flex;gap:12px;align-items:baseline;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.le:last-child{border-bottom:none}
.le .pill{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;flex:none}
.le.send .pill{background:rgba(224,90,78,.14);color:var(--red)}
.le.restock .pill{background:rgba(61,220,107,.13);color:var(--lit)}
.le.longlead .pill{background:rgba(61,214,220,.12);color:var(--cyan)}
.le .main{flex:1;color:#c3cec8;min-width:0}
.le .main b{color:var(--text)}
.le .when{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);flex:none}
.statusbtn{background:var(--panel-2);border:1px solid var(--line);color:var(--lit);border-radius:6px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer;flex:none}
.statusbtn:hover{border-color:var(--green)}

.loading{color:var(--muted);text-align:center;padding:30px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* fleet */
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.bot{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:0 11px 11px 0;padding:12px 13px}
.bot.active{border-left-color:var(--lit)}
.bot.waiting{border-left-color:var(--amber)}
.bot.down{border-left-color:var(--red)}
.bot .bn{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--text)}
.bot .bs{font-size:12px;margin-top:5px}
.bot.active .bs{color:var(--lit)}
.bot.waiting .bs{color:var(--amber)}
.bot.down .bs{color:var(--red)}
.bot .bw{font-size:11px;color:var(--muted);margin-top:3px;min-height:14px}
.bot .man{position:absolute;top:9px;right:10px;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.bot .setbtn{margin-top:9px;width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:6px;font:inherit;font-size:11px;cursor:pointer}
.bot .setbtn:hover{border-color:var(--green);color:var(--text)}
.botmenu{position:fixed;inset:0;background:rgba(6,9,8,.8);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.botmenu .inner{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:340px;width:100%}
.botmenu h3{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:22px;margin:0 0 4px;color:var(--text)}
.botmenu .opt{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:12px 14px;font:inherit;font-weight:500;cursor:pointer;margin-top:8px}
.botmenu .opt:hover{border-color:var(--green);background:#1f2a24}
.botmenu .opt.clear{color:var(--muted)}
.botmenu .cancel{margin-top:12px;width:100%;background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;padding:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Parts Logger</h1>
    <span class="lbl" id="conn">connecting…</span>
  </header>

  <div id="app">
    <div class="loading">Loading stock…</div>
  </div>
</div>

<script>
/* ================================================================
   Paste your Apps Script /exec URL here (from the inventory deploy)
   ================================================================ */
var API_URL = "https://script.google.com/macros/s/AKfycbzlgzq011Ig913hM5aSdv3XMFr-a6-Qe3MAfyH8F9N2JmhVGkiL2XH2_mjH2nFgAwrM/exec";

var state = { parts:[], stock:{}, longOpen:[], donors:[], recent:[] };
var mode = "consumable"; // or "longlead"

/* ---------- boot ---------- */
function boot(){
  if(!API_URL){
    document.getElementById("conn").textContent = "no backend set";
    document.getElementById("app").innerHTML =
      '<div class="card">Set <span class="mono">API_URL</span> at the top of the script to your Apps Script /exec link, then reload.</div>';
    return;
  }
  refresh();
}

function refresh(){
  fetch(API_URL + "?t=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok) throw new Error(d.error||"bad response");
      state = d;
      document.getElementById("conn").textContent = "live";
      render();
    })
    .catch(function(err){
      document.getElementById("conn").textContent = "offline";
      document.getElementById("app").innerHTML =
        '<div class="card">Couldn\'t reach the backend.<div class="hint">'+esc(String(err))+'</div></div>';
    });
}

/* ---------- render ---------- */
function render(){
  var cons = state.parts.filter(function(p){ return p.category==="consumable"; });
  var longs = state.parts.filter(function(p){ return p.category==="longlead"; });

  var h = "";

  /* fleet status */
  h += '<div class="sec-title">Fleet status</div>';
  h += renderFleet();

  /* consumable stock */
  h += '<div class="sec-title">Consumable stock</div><div class="grid">';
  cons.forEach(function(p){
    var q = state.stock[p.name] != null ? state.stock[p.name] : 0;
    var low = q <= 0 ? "zero" : (p.low && q <= p.low ? "low" : "");
    var tag = q <= 0 ? "Out of stock" : (low==="low" ? "Low" : "");
    h += '<div class="chip '+low+'"><div class="n">'+esc(p.name)+'</div>'
       + '<div class="c">'+q+'<span class="u">left</span></div>'
       + '<div class="tag">'+tag+'</div></div>';
  });
  h += '</div>';

  /* donor bots */
  h += '<div class="sec-title">Bots being scavenged</div>';
  if(!state.donors.length){
    h += '<div class="empty">No bots are currently donating parts.</div>';
  } else {
    state.donors.forEach(function(d){
      h += '<div class="donor"><span class="b">'+esc(d.donor)+'</span>'
         + '<span class="d">gave its <b>'+esc(d.part)+'</b> to '+esc(d.forBot||"another bot")+'</span>'
         + '<span class="since">'+esc(d.since||"")+'</span></div>';
    });
  }

  /* open long-lead */
  h += '<div class="sec-title">Waiting on long-lead parts</div>';
  var open = state.longOpen || [];
  if(!open.length){
    h += '<div class="empty">Nothing outstanding.</div>';
  } else {
    h += '<div class="log">';
    open.forEach(function(o){
      h += '<div class="le longlead"><span class="pill">'+esc(o.status||"Waiting")+'</span>'
         + '<span class="main"><b>'+esc(o.part)+'</b> for '+esc(o.bot||"?")
         + (o.source? ' &middot; '+esc(o.source):'')
         + (o.donor? ' ('+esc(o.donor)+')':'')
         + (o.broke? ' &middot; broke '+esc(o.broke):'') + '</span>'
         + '<button class="statusbtn" onclick="markFitted(\''+esc(o.id)+'\')">Mark fitted</button></div>';
    });
    h += '</div>';
  }

  /* the form */
  h += '<div class="sec-title">Log an entry</div><div class="card">';
  h += '<div class="toggle">'
     + '<button id="tc" class="'+(mode==="consumable"?"on":"")+'" onclick="setMode(\'consumable\')">Consumable</button>'
     + '<button id="tl" class="'+(mode==="longlead"?"on":"")+'" onclick="setMode(\'longlead\')">Long-lead / scavenge</button>'
     + '</div>';
  h += mode==="consumable" ? consForm(cons) : longForm(longs);
  h += '<div class="flash" id="flash"></div>';
  h += '</div>';

  /* recent history */
  h += '<div class="sec-title">Recent activity</div>';
  h += renderRecent();

  document.getElementById("app").innerHTML = h;
  wireForm();
}

function consForm(cons){
  var opts = cons.map(function(p){ return '<option>'+esc(p.name)+'</option>'; }).join("");
  return ''
  + '<div class="kindrow">'
  +   '<label class="on" id="kSend"><input type="radio" name="kind" value="send" checked> Send out (−)</label>'
  +   '<label id="kRestock"><input type="radio" name="kind" value="restock"> Restock (+)</label>'
  + '</div>'
  + '<div class="row2">'
  +   '<div class="f"><span class="lbl">Part</span><select id="c_part">'+opts+'</select></div>'
  +   '<div class="f"><span class="lbl">Quantity</span><div class="qty">'
  +     '<button type="button" onclick="bump(-1)">−</button>'
  +     '<input id="c_qty" type="number" value="1" min="1" inputmode="numeric">'
  +     '<button type="button" onclick="bump(1)">+</button></div></div>'
  + '</div>'
  + '<div class="row2" id="sendOnly">'
  +   '<div class="f"><span class="lbl">Teleoperator</span><input id="c_teleop" placeholder="Who received it"></div>'
  +   '<div class="f"><span class="lbl">Bot</span><input id="c_bot" placeholder="Which bot"></div>'
  + '</div>'
  + '<div class="row2" id="sendOnly2">'
  +   '<div class="f"><span class="lbl">Date broke</span><input id="c_broke" type="date"></div>'
  +   '<div class="f"><span class="lbl">Date replaced</span><input id="c_replaced" type="date"></div>'
  + '</div>'
  + '<div class="f"><span class="lbl" id="reasonLbl">Reason</span><textarea id="c_reason" placeholder="What caused this part to be sent?"></textarea></div>'
  + '<button class="save" id="saveC">Log it</button>';
}

function longForm(longs){
  var opts = longs.map(function(p){ return '<option>'+esc(p.name)+'</option>'; }).join("");
  return ''
  + '<div class="row2">'
  +   '<div class="f"><span class="lbl">Part needed</span><select id="l_part">'+opts+'</select></div>'
  +   '<div class="f"><span class="lbl">Bot needing it</span><input id="l_bot" placeholder="Which bot is down"></div>'
  + '</div>'
  + '<div class="row2">'
  +   '<div class="f"><span class="lbl">Date broke</span><input id="l_broke" type="date"></div>'
  +   '<div class="f"><span class="lbl">Source</span><select id="l_source" onchange="toggleDonor()">'
  +     '<option>On order from Unitree</option><option>Scavenged from another bot</option>'
  +     '<option>Have a spare</option></select></div>'
  + '</div>'
  + '<div class="f" id="donorWrap" style="display:none"><span class="lbl">Scavenged from which bot?</span>'
  +   '<input id="l_donor" placeholder="Donor bot name"></div>'
  + '<div class="row2">'
  +   '<div class="f"><span class="lbl">Status</span><select id="l_status" onchange="toggleFitted()">'
  +     '<option>Waiting</option><option>Fitted</option></select></div>'
  +   '<div class="f" id="fittedWrap" style="display:none"><span class="lbl">Date fitted</span><input id="l_fitted" type="date"></div>'
  + '</div>'
  + '<div class="f"><span class="lbl">Note</span><textarea id="l_note" placeholder="Anything else worth recording"></textarea></div>'
  + '<button class="save" id="saveL">Log it</button>';
}

function renderFleet(){
  var bots = state.bots || [];
  if(!bots.length) return '<div class="empty">No bots in the BOTS tab yet.</div>';
  var order = { "Down":0, "Waiting for Part":1, "Active":2 };
  bots = bots.slice().sort(function(a,b){
    var oa = order[a.status]!=null?order[a.status]:1, ob = order[b.status]!=null?order[b.status]:1;
    if(oa!==ob) return oa-ob;
    return a.bot.localeCompare(b.bot);
  });
  var h = '<div class="fleet">';
  bots.forEach(function(b){
    var cls = b.status==="Active"?"active":(b.status==="Down"?"down":"waiting");
    h += '<div class="bot '+cls+'">'
       + (b.manual? '<span class="man">manual</span>':'')
       + '<div class="bn">'+esc(b.bot)+'</div>'
       + '<div class="bs">'+esc(b.status)+'</div>'
       + '<div class="bw">'+(b.waitingFor? 'Needs '+esc(b.waitingFor):'')+'</div>'
       + '<button class="setbtn" onclick="openBotMenu(\''+esc(b.bot)+'\')">Set status</button>'
       + '</div>';
  });
  return h + '</div>';
}

function openBotMenu(bot){
  var b = (state.bots||[]).filter(function(x){ return x.bot===bot; })[0] || {bot:bot};
  var m = document.createElement("div");
  m.className = "botmenu";
  m.innerHTML =
    '<div class="inner"><h3>'+esc(bot)+'</h3>'
    + '<div class="lbl" style="margin-bottom:6px">Set a manual status (sticks until you clear it)</div>'
    + '<button class="opt" onclick="setBot(\''+esc(bot)+'\',\'Down\')">Down</button>'
    + '<button class="opt" onclick="setBot(\''+esc(bot)+'\',\'Waiting for Part\')">Waiting for Part</button>'
    + '<button class="opt" onclick="setBot(\''+esc(bot)+'\',\'\')">Active (auto)</button>'
    + '<button class="cancel" onclick="closeBotMenu()">Cancel</button></div>';
  m.onclick = function(e){ if(e.target===m) closeBotMenu(); };
  document.body.appendChild(m);
}
function closeBotMenu(){ var m=document.querySelector(".botmenu"); if(m) m.remove(); }
function setBot(bot, status){
  closeBotMenu();
  post({ action:"bot_status", bot:bot, status:status }, null,
       status? (bot+" set to "+status) : (bot+" back to auto"));
}

function renderRecent(){
  if(!state.recent || !state.recent.length) return '<div class="empty">Nothing logged yet.</div>';
  var h = '<div class="log">';
  state.recent.forEach(function(e){
    if(e.kind==="consumable"){
      var cls = (e.sub||"").toLowerCase()==="restock" ? "restock" : "send";
      var sign = cls==="restock" ? "+" : "−";
      var extra = [];
      if(e.teleop) extra.push(esc(e.teleop));
      if(e.bot) extra.push(esc(e.bot));
      if(e.reason) extra.push(esc(e.reason));
      h += '<div class="le '+cls+'"><span class="pill">'+sign+e.qty+'</span>'
         + '<span class="main"><b>'+esc(e.part)+'</b>'
         + (extra.length? ' &middot; '+extra.join(" &middot; "):'') + '</span>'
         + '<span class="when">'+ago(e.when)+'</span></div>';
    } else {
      h += '<div class="le longlead"><span class="pill">'+esc(e.status||"long")+'</span>'
         + '<span class="main"><b>'+esc(e.part)+'</b> for '+esc(e.bot||"?")
         + (e.source? ' &middot; '+esc(e.source):'') + '</span>'
         + '<span class="when">'+ago(e.when)+'</span></div>';
    }
  });
  return h + '</div>';
}

/* ---------- interactions ---------- */
function setMode(m){ mode = m; render(); }
function bump(n){ var el=document.getElementById("c_qty"); el.value = Math.max(1,(parseInt(el.value,10)||1)+n); }
function toggleDonor(){ var s=document.getElementById("l_source").value; document.getElementById("donorWrap").style.display = /scaveng/i.test(s)?"block":"none"; }
function toggleFitted(){ var s=document.getElementById("l_status").value; document.getElementById("fittedWrap").style.display = s==="Fitted"?"block":"none"; }

function wireForm(){
  var sc = document.getElementById("saveC");
  if(sc){
    var radios = document.querySelectorAll('input[name=kind]');
    radios.forEach(function(rb){ rb.onchange = function(){
      var send = document.querySelector('input[name=kind]:checked').value === "send";
      document.getElementById("kSend").classList.toggle("on", send);
      document.getElementById("kRestock").classList.toggle("on", !send);
      document.getElementById("sendOnly").style.display = send?"flex":"none";
      document.getElementById("sendOnly2").style.display = send?"flex":"none";
      document.getElementById("reasonLbl").textContent = send?"Reason":"Note (optional)";
    }; });
    sc.onclick = saveConsumable;
  }
  var sl = document.getElementById("saveL");
  if(sl) sl.onclick = saveLong;
}

function post(payload, btn, okMsg){
  if(btn){ btn.disabled = true; btn.textContent = "Saving…"; }
  return fetch(API_URL, { method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload) })
    .then(function(){
      flash(okMsg, true);
      setTimeout(refresh, 1400);  // re-read so counts update
    })
    .catch(function(){
      flash("Couldn't save — check connection", false);
      if(btn){ btn.disabled=false; btn.textContent="Log it"; }
    });
}

function saveConsumable(){
  var kind = document.querySelector('input[name=kind]:checked').value;
  var p = {
    action:"consumable", kind:kind,
    part:val("c_part"), qty:val("c_qty"),
    teleop:val("c_teleop"), bot:val("c_bot"),
    broke:val("c_broke"), replaced:val("c_replaced"), reason:val("c_reason")
  };
  if(!p.part){ flash("Pick a part", false); return; }
  if(!(parseInt(p.qty,10)>0)){ flash("Quantity must be at least 1", false); return; }
  post(p, document.getElementById("saveC"), (kind==="send"?"Sent ":"Restocked ")+p.qty+" × "+p.part);
}

function saveLong(){
  var p = {
    action:"longlead", part:val("l_part"), bot:val("l_bot"),
    broke:val("l_broke"), source:val("l_source"), donor:val("l_donor"),
    status:val("l_status"), fitted:val("l_fitted"), note:val("l_note")
  };
  if(!p.part){ flash("Pick a part", false); return; }
  if(!p.bot){ flash("Which bot needs it?", false); return; }
  if(/scaveng/i.test(p.source) && !p.donor){ flash("Name the donor bot", false); return; }
  post(p, document.getElementById("saveL"), "Logged "+p.part+" for "+p.bot);
}

function markFitted(id){
  var today = new Date().toISOString().slice(0,10);
  post({ action:"longlead_update", id:id, status:"Fitted", fitted:today }, null, "Marked fitted");
}

/* ---------- helpers ---------- */
function val(id){ var el=document.getElementById(id); return el?el.value.trim():""; }
function flash(msg, ok){
  var el=document.getElementById("flash"); if(!el) return;
  el.className = "flash "+(ok?"ok":"err"); el.textContent = msg;
}
function ago(iso){
  if(!iso) return "";
  var ms = Date.now()-new Date(iso).getTime();
  if(isNaN(ms)) return "";
  var m=Math.floor(ms/60000); if(m<1) return "now"; if(m<60) return m+"m";
  var hh=Math.floor(m/60); if(hh<24) return hh+"h";
  return Math.floor(hh/24)+"d";
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }

boot();
</script>
