function toast(msg){$('toast').textContent=msg;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',3500);}
function changeTab(t,f='all'){tab=t;filter=f;query='';render();window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const a=b.dataset.action,id=b.dataset.id;if(a==='close')close();else if(a==='refresh')refresh();else if(a==='tab')changeTab(id);else if(a==='filter'){filter=id;render();}else if(a==='metric'){if(id==='repairs')changeTab('repair');else if(id==='lowstock')changeTab('stock','low');else{filter=id;render();}}else if(a==='bot')botDetail(id);else if(a==='report')report(id);else if(a==='repair')repairDetail(id);else if(a==='status')statusForm(id);else if(a==='issue'||a==='restock'||a==='count')stockForm(id,a==='issue'?'send':a==='count'?'set':'restock');else if(a==='region')regionPanel(id,b.dataset.region,b.dataset.side);else if(a==='report-part')report(id,b.dataset.part,b.dataset.side);else if(a==='copy'){try{await navigator.clipboard.writeText(id);toast('Serial copied');}catch{toast('Copy unavailable. Select the serial text to copy.');}}else if(a==='reset'){storage.remove('homie-fleet-demo-v2');state=seed();render();toast('Demo reset');}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.hit')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
$('dialog').addEventListener('cancel',e=>{if(busy)e.preventDefault();});$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();const el=$('search');el.focus();try{el.setSelectionRange(pos,pos);}catch{}}});
document.addEventListener('change',e=>{const f=e.target.closest('form');if(!f)return;if(f.id==='reportForm'){if(e.target.name==='part'){$('sideField').hidden=!SIDED.includes(e.target.value);if($('sideField').hidden)f.elements.side.value='';}if(e.target.name==='source')$('donorFields').hidden=e.target.value!=='Scavenged from another bot';if(e.target.name==='bot')f.elements.donor.innerHTML=opts(state.bots.map(b=>b.bot).filter(b=>b!==e.target.value),'',true);if(e.target.id==='photoInput')preparePhoto(e.target.files[0]);}if(f.id==='repairForm'&&e.target.name==='status')$('testWarning').hidden=e.target.value!=='Tested';});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));if(!v.actor?.trim()){$('formerror').textContent='Enter who is logging this change.';return;}let d={...v,actor:v.actor.trim()};try{if(f.id==='reportForm'){if(!v.bot||!v.part)throw Error('Choose a bot and a part.');if(SIDED.includes(v.part)&&!v.side)throw Error('Choose left or right.');if(!v.owner?.trim())throw Error('Enter the responsible person.');if(v.source==='Scavenged from another bot'&&(!v.donor||v.donor===v.bot||!v.donorOwner?.trim()))throw Error('Choose a different donor and its responsible person.');d={...d,action:'repair_create',side:SIDED.includes(v.part)?v.side:'',donor:v.source==='Scavenged from another bot'?v.donor:'',photo};}else if(f.id==='repairForm'){d={...d,action:'repair_update',id:f.dataset.id};}else if(f.id==='stockForm'){const qty=Number(v.qty);if(!Number.isInteger(qty)||qty<(f.dataset.kind==='set'?0:1))throw Error('Enter a whole quantity.');if(f.dataset.kind==='send'&&!v.bot)throw Error('Choose the receiving bot.');d={...d,action:'stock',kind:f.dataset.kind,part:f.dataset.id,qty};}else if(f.id==='statusForm'){if(v.status&&!v.note.trim())throw Error('Add a reason for the manual status.');d={...d,action:'bot_status',bot:f.dataset.id};}else return;save(d);}catch(err){$('formerror').textContent=err.message;}});
$('refresh').innerHTML=icon('refresh');$('demoBanner').hidden=LIVE;refresh();if(LIVE)setInterval(()=>{if(!$('dialog').open&&!document.hidden&&!busy)refresh();},60000);
</script></body></html>
